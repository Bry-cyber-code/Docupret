<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Redirection – DocuPrêt</title>
<link rel="canonical" href="https://docupret.fr/lettre-demission.html">
<script>
// Ancienne adresse lettre.html?type=… : on renvoie vers la vraie page du document
(function(){
  var pages = {demission:'lettre-demission.html', motivation:'lettre-motivation.html', conges:'demande-conges.html', rupture:'rupture-conventionnelle.html', preavis:'preavis-locataire.html', hebergement:'attestation-hebergement.html', honneur:'attestation-sur-l-honneur.html', resiliation:'lettre-resiliation.html', reclamation:'lettre-reclamation.html', procuration:'procuration.html', vente:'contrat-vente-vehicule.html', pret:'pret-vehicule.html', sinistre:'declaration-sinistre.html', quittance:'quittance-loyer.html'};
  var type = null;
  try { type = new URLSearchParams(location.search).get('type'); } catch(e){}
  var page = pages[type] || 'lettre-demission.html';
  try { document.querySelector('link[rel=canonical]').href = 'https://docupret.fr/' + page; } catch(e){}
  location.replace('/' + page + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/lettre-demission.html"></noscript>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>Cette page a changé d'adresse. <a href="/lettre-demission.html">Ouvrir la lettre de démission</a> ou <a href="/">voir tous les documents</a>.</p>
</body>
</html>
