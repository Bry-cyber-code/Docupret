<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable – DocuPrêt</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4A7BD0">
<style>
  :root{color-scheme:light;--bleu:#4A7BD0;--bleu-fonce:#2F5DAE;--bleu-clair:#EAF1FB;--fond:#F6F9FD;--texte:#1E2A42;--gris:#6B778C;--bord:#E2E8F2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fond);color:var(--texte);min-height:100vh;display:grid;place-items:center;padding:24px 16px;text-align:center}
  a{color:inherit;text-decoration:none}
  .logo{display:inline-flex;align-items:center;gap:9px;margin-bottom:28px}
  .logo-icone{display:block;width:40px;height:40px} .logo-icone svg{width:100%;height:100%;display:block}
  .logo-mot{font-weight:800;font-size:1.4rem;letter-spacing:-.02em} .logo-mot span{color:var(--bleu)}
  h1{font-size:clamp(1.4rem,5vw,2rem);font-weight:800;margin-bottom:8px}
  p{color:var(--gris);margin-bottom:22px}
  .liens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .liens a{border:1.5px solid var(--bord);background:#fff;border-radius:50px;padding:10px 16px;font-weight:650}
  .liens a.principal{background:var(--bleu);border-color:var(--bleu);color:#fff}
</style>
</head>
<body>
<main>
  <a href="./" class="logo" data-lien=""><span class="logo-icone"><svg viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="lg-tete" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A9BF0"/><stop offset="1" stop-color="#3563BF"/></linearGradient></defs><rect width="36" height="36" rx="10" fill="url(#lg-tete)"/><rect x="7.5" y="11" width="13" height="17" rx="2" fill="#fff" opacity=".35"/><path d="M14 7.5h7.5l5.5 5.5v13.5a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2v-17a2 2 0 0 1 2-2z" fill="#fff"/><path d="M21.5 7.5v3.5a2 2 0 0 0 2 2H27z" fill="#C9DAF8"/><path d="M15.3 19.6l2.7 2.7 5-5.6" fill="none" stroke="#3563BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="logo-mot">Docu<span>Prêt</span></span></a>
  <h1>Oups, cette page n'existe pas</h1>
  <p>Le lien est peut-être incomplet. Vos documents sont toujours là :</p>
  <div class="liens">
    <a class="principal" href="./" data-lien="">Accueil</a>
    <a href="facture.html" data-lien="facture.html">Facture et devis</a>
    <a href="lettre.html?type=demission" data-lien="lettre.html?type=demission">Lettres</a>
    <a href="logo.html" data-lien="logo.html">Logo</a>
  </div>
</main>
<script>
  // Liens valables quelle que soit l'adresse demandée
  (function(){ var base = /^\/docupret\//i.test(location.pathname) ? location.pathname.match(/^\/docupret\//i)[0] : '/';
    document.querySelectorAll('[data-lien]').forEach(function(a){ a.href = base + a.getAttribute('data-lien'); }); })();
</script>
</body>
</html>
